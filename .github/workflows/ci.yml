name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Compute next version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=%s 2>/dev/null || git log --pretty=%s)

          BUMP=""
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE '^fix(\([^)]+\))?:'; then
            BUMP="patch"
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
          case "$BUMP" in
            major) NEXT_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *) NEXT_VERSION="" ;;
          esac

          {
            echo "### Next Release"
            echo ""
            if [ -n "$NEXT_VERSION" ]; then
              echo "**Next version:** \`$NEXT_VERSION\`"
              echo ""
              echo "Run the [release workflow](../../actions/workflows/release.yml) and leave the version input blank to publish \`$NEXT_VERSION\`, or override it."
            else
              echo "No \`feat:\`/\`fix:\` commits since the last release — nothing to version yet."
            fi
          } >> $GITHUB_STEP_SUMMARY
