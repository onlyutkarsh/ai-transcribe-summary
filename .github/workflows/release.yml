name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.2.0). Leave blank to auto-bump based on conventional commits since the last release."
        required: false
        type: string

run-name: release ${{ inputs.version || '(auto)' }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor == 'onlyutkarsh'
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: resolve_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=%s 2>/dev/null || git log --pretty=%s)

            BUMP=""
            if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qE '^fix(\([^)]+\))?:'; then
              BUMP="patch"
            fi

            if [ -z "$BUMP" ]; then
              echo "Error: No feat:/fix: commits since the last release, and no version was provided."
              exit 1
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "$LAST_TAG"
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            echo "Auto-computed version from conventional commits: $VERSION"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 0.2.0)"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Error: Tag $VERSION already exists"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version (package.json, manifest.json, versions.json)
        run: |
          npm version ${{ steps.resolve_version.outputs.version }} --no-git-tag-version --allow-same-version
          node scripts/version-bump.mjs ${{ steps.resolve_version.outputs.version }}

      - name: Build plugin
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Commit version bump
        run: |
          git add package.json package-lock.json manifest.json versions.json
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping"
          else
            git commit -m "chore(release): ${{ steps.resolve_version.outputs.version }}"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.resolve_version.outputs.version }}" -m "Release ${{ steps.resolve_version.outputs.version }}"
          git push origin "${{ steps.resolve_version.outputs.version }}"

      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.resolve_version.outputs.version }}'
            });
            return data.body;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_version.outputs.version }}
          name: ${{ steps.resolve_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
          body: ${{ steps.release_notes.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Release Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.resolve_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.resolve_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ GitHub Release created with main.js, manifest.json, styles.css" >> $GITHUB_STEP_SUMMARY
