name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.2.0)"
        required: true
        type: string

run-name: v${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor == 'onlyutkarsh'
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 0.2.0)"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Error: Tag ${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bump version (package.json, manifest.json, versions.json)
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          node scripts/version-bump.mjs ${{ inputs.version }}

      - name: Build plugin
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Commit version bump
        run: |
          git add package.json package-lock.json manifest.json versions.json
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping"
          else
            git commit -m "chore(release): ${{ inputs.version }}"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ inputs.version }}'
            });
            return data.body;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
          body: ${{ steps.release_notes.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Release Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ GitHub Release created with main.js, manifest.json, styles.css" >> $GITHUB_STEP_SUMMARY
